name: dbt CI

# ─────────────────────────────────────────────────────────────────
# Trigger — runs on every pull request targeting develop.
# Does NOT run on push to develop or on PRs to main.
# This gate must pass before a branch can be merged.
# ─────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches:
      - develop

# Cancel any in-progress run for the same PR if a new commit is pushed.
# Prevents queue buildup when you push fixes mid-review.
concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-ci:
    name: dbt compile + test
    runs-on: ubuntu-latest

    # ─────────────────────────────────────────────────────────────
    # Environment variables vs GitHub Secrets — key distinction:
    #
    # GitHub Secrets (${{ secrets.NAME }}) are encrypted at rest
    # in GitHub and are NEVER printed in logs — GitHub masks them
    # automatically. They are the right place for credentials.
    #
    # Environment variables (env: block) are plain key-value pairs
    # visible in the YAML. Use for non-sensitive config only.
    #
    # Rule: if it's a credential → secrets.*
    #       if it's config/non-sensitive → env: block directly
    # ─────────────────────────────────────────────────────────────

    env:
      DBT_PROJECT_DIR: dbt_project        # path to dbt_project.yml inside the repo
      DBT_PROFILES_DIR: /tmp/dbt_profiles # written inline in the setup step below
      DBT_TARGET: ci                      # matches the target name in profiles.yml

    steps:

      # ───────────────────────────────────────────────────────────
      # 1. Checkout
      # ───────────────────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────
      # 2. Python setup
      # ───────────────────────────────────────────────────────────

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ───────────────────────────────────────────────────────────
      # 3. Cache pip dependencies
      # Hashes requirements so the cache is invalidated only when
      # package versions change — not on every commit.
      # ───────────────────────────────────────────────────────────

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dbt_project/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ───────────────────────────────────────────────────────────
      # 4. Install dbt
      # ───────────────────────────────────────────────────────────

      - name: Install dbt-core and dbt-redshift
        run: |
          pip install --upgrade pip
          pip install dbt-core==1.8.* dbt-redshift==1.8.*
          dbt --version

      # ───────────────────────────────────────────────────────────
      # 5. Write profiles.yml inline
      #
      # profiles.yml is NEVER committed to the repo — it contains
      # the Redshift host and credentials. Instead we write it at
      # runtime to a temp directory ($DBT_PROFILES_DIR) that only
      # exists for the life of this runner.
      #
      # schema: dev_staging — dbt appends the layer suffix per
      # dbt_project.yml config (dev_staging, dev_seeds, etc.)
      # ───────────────────────────────────────────────────────────

      - name: Write dbt profiles.yml
        run: |
          mkdir -p $DBT_PROFILES_DIR
          cat << EOF > $DBT_PROFILES_DIR/profiles.yml
          olist_ecommerce:
            target: ${{ env.DBT_TARGET }}
            outputs:
              ci:
                type: redshift
                method: database
                host: ${{ secrets.REDSHIFT_HOST }}
                port: 5439
                user: ${{ secrets.REDSHIFT_USER }}
                password: ${{ secrets.REDSHIFT_PASSWORD }}
                dbname: ${{ secrets.REDSHIFT_DBNAME }}
                schema: dev_staging
                threads: 4
                connect_timeout: 30
                ra3_node: true
          EOF

      # ───────────────────────────────────────────────────────────
      # 6. Install dbt packages
      # Pulls packages listed in dbt_project/packages.yml
      # (dbt_utils for generate_surrogate_key). dbt_packages/ is
      # gitignored so must be fetched fresh on every CI run.
      # ───────────────────────────────────────────────────────────

      - name: Install dbt packages
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps --project-dir .

      # ───────────────────────────────────────────────────────────
      # 7. dbt seed
      #
      # Loads static reference CSVs from dbt_project/seeds/ into
      # Redshift before compile and test run.
      #
      # Why this is required in CI:
      #   stg_products.sql references:
      #     {{ ref('product_category_name_translation') }}
      #   dbt compile resolves ALL ref() calls before running SQL.
      #   If the seed table doesn't exist in Redshift when compile
      #   runs, dbt raises "node not found" and compile fails — even
      #   though the CSV file is committed to the repo.
      #
      #   dbt seed creates the dev_seeds.product_category_name_translation
      #   table so the ref() in stg_products resolves correctly.
      #
      # Seeds load to dev_seeds schema (set in dbt_project.yml).
      # The 73-row CSV takes under 1 second. Cost: negligible.
      # ───────────────────────────────────────────────────────────

      - name: dbt seed
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt seed --project-dir . --profiles-dir $DBT_PROFILES_DIR --target $DBT_TARGET

      # ───────────────────────────────────────────────────────────
      # 8. dbt compile
      #
      # What compile catches (runs locally — zero extra Redshift cost
      # beyond the seed load above):
      #   ✓ Broken ref() — model renamed but reference not updated
      #   ✓ Missing source — source name doesn't match sources.yml
      #   ✓ Malformed Jinja — unclosed block, wrong macro syntax
      #   ✓ Missing models — a ref() points to a file that doesn't exist
      #
      # What compile does NOT catch:
      #   ✗ Bad SQL logic — wrong column name, wrong join condition
      #   ✗ Type mismatches — VARCHAR cast to INTEGER failing at runtime
      #   ✗ Data quality — nulls in not_null columns, duplicates
      #   Those are caught by dbt test (next step) which hits Redshift.
      # ───────────────────────────────────────────────────────────

      - name: dbt compile
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt compile --project-dir . --profiles-dir $DBT_PROFILES_DIR --target $DBT_TARGET

      # ───────────────────────────────────────────────────────────
      # 9. dbt test — all staging models
      #
      # CHANGED in Feature 4.6 (was: --select stg_orders in Epic 1)
      # NOW: --select staging  covers all 8 staging models:
      #   stg_orders, stg_customers, stg_order_items, stg_products,
      #   stg_sellers, stg_payments, stg_reviews, stg_geolocation
      #
      # Why we expanded now:
      #   In Epic 1, stg_orders was the only staging model — scoping CI
      #   to it was correct. Now there are 8 staging models. A gate that
      #   covers 1 of 8 is not a real gate: a broken stg_customers could
      #   merge to develop, silently fail the next pipeline run, and
      #   surface as an Airflow error hours later rather than a PR
      #   comment now. CI scope grows as the codebase grows.
      #
      # Why we do NOT test intermediate and marts in CI:
      #   Intermediate and mart tests require full Redshift scans across
      #   all rows and multi-table joins — slower and more expensive.
      #   They're validated locally before the PR is opened. CI targets
      #   staging because it's the most common regression surface:
      #   direct source dependencies, column renames, type casts.
      #
      # Tests run per model (defined in schema.yml):
      #   - not_null on all key columns and non-nullable business columns
      #   - unique on surrogate keys and natural keys where applicable
      #   - accepted_values on status/categorical columns (e.g. review_score)
      #   - relationships tests on FK columns where configured
      # ───────────────────────────────────────────────────────────

      - name: dbt test (staging layer — all 8 models)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt test --select staging --project-dir . --profiles-dir $DBT_PROFILES_DIR --target $DBT_TARGET

      # ───────────────────────────────────────────────────────────
      # 10. Post — clean up profiles.yml
      # Defensive step: wipe the credentials file from the runner
      # even though GitHub destroys the entire VM after the job.
      # Signals intent in code reviews that secrets are treated carefully.
      # ───────────────────────────────────────────────────────────

      - name: Clean up profiles.yml
        if: always()    # runs even if previous steps failed
        run: rm -f $DBT_PROFILES_DIR/profiles.yml